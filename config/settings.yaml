system:
  name: "Autonomous MicroBusiness Agent"
  version: "1.1.0"
  log_level: "INFO"
  loop_interval_seconds: 3600

budget:
  total_budget_eur: 60.0
  monthly_limit_eur: 20.0
  min_reserve_eur: 5.0
  soft_warning_eur: 15.0
  hard_stop_eur: 19.0
  currency: "EUR"

# Local Ollama models (optimized for 4 GB VRAM)
# Only models that safely fit: phi3.5:mini (~2.2 GB), llama3.2:3b (~2.0 GB)
# 7B/8B models (>4 GB) are NOT used — they fall back to Claude Haiku
local_models:
  enabled: true                      # set false to disable Ollama entirely
  ollama_url: "http://localhost:11434"
  auto_pull: false                   # set true to auto-download models on first run
  vram_budget_gb: 3.5                # conservative limit for 4 GB card
  models:
    nano:
      name: "phi3.5:mini"
      vram_gb: 2.2
      tasks: [classification, filtering, routing, parsing, simple_qa]
    small:
      name: "llama3.2:3b"
      vram_gb: 2.0
      tasks: [summarization, simple_answers, extraction]
    embed:
      name: "nomic-embed-text"
      vram_gb: 0.3
      tasks: [embeddings]

# API models (used when local not available or task too complex)
models:
  premium:
    id: "claude-opus-4-7"
    cost_per_1k_input: 0.015
    cost_per_1k_output: 0.075
    use_for: [complex_reasoning, planning, coding, strategic_decisions]
  standard:
    id: "claude-sonnet-4-6"
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
    use_for: [analysis, writing, moderate_complexity, market_research]
  cheap:
    id: "claude-haiku-4-5-20251001"
    cost_per_1k_input: 0.00025
    cost_per_1k_output: 0.00125
    use_for: [classification, parsing, summaries, simple_answers, routing]

memory:
  short_term_capacity: 50
  long_term_db: "data/memory/longterm.db"
  embeddings_dir: "data/embeddings"
  compression_threshold: 100
  max_context_tokens: 4000

business:
  target_monthly_revenue_eur: 20.0
  focus_markets:
    - small_local_businesses
    - clubs_associations
    - pet_care
    - hobby_businesses
    - small_creators
    - administration_problems
    - excel_pdf_processes
  priority_models:
    - small_automations
    - micro_saas
    - digital_templates
    - ocr_pdf_processes
    - local_business_problems
    - content_automation
    - data_processing
    - simple_bots

agents:
  planner:
    enabled: true
    max_tokens: 2000
    temperature: 0.3
  builder:
    enabled: true
    max_tokens: 4000
    temperature: 0.2
  sales:
    enabled: true
    max_tokens: 1500
    temperature: 0.5
  analyst:
    enabled: true
    max_tokens: 2000
    temperature: 0.1
  critic:
    enabled: true
    max_tokens: 1500
    temperature: 0.2
  memory:
    enabled: true
    max_tokens: 1000
    temperature: 0.1
